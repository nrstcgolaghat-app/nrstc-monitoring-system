<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRSTC Marks Entry</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    color: #000000;
  }
  .as-text { font-family: "Noto Sans Bengali", Arial, sans-serif; }
  header {
    background-color: #eaf3fb;
    border-bottom: 2px solid #1a5aa8;
    padding: 12px 15px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 20px; color: #1a3d6d; }
  header p { margin: 4px 0 0 0; font-size: 13px; color: #333333; }
  .container { max-width: 900px; margin: 0 auto; padding: 15px; }

  fieldset { border: 1px solid #1a5aa8; margin-bottom: 15px; padding: 10px 12px 14px 12px; }
  legend { background-color: #eaf3fb; border: 1px solid #1a5aa8; padding: 3px 10px; font-weight: bold; color: #1a3d6d; font-size: 15px; }
  label { display: block; margin-top: 10px; margin-bottom: 3px; font-size: 14px; font-weight: bold; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 8px; font-size: 14px; font-family: Arial, Helvetica, sans-serif; border: 1px solid #999999;
  }
  .two-col { display: flex; gap: 10px; }
  .two-col > div { flex: 1; }

  button {
    padding: 12px 18px; font-size: 15px; font-weight: bold; color: #ffffff;
    background-color: #1a7a3c; border: 1px solid #145a2c; cursor: pointer; margin-top: 8px; margin-right: 6px;
  }
  .btn-blue { background-color: #1a5aa8; border-color: #123d73; }
  .btn-orange { background-color: #c96a1a; border-color: #8f4a10; }
  .btn-small { padding: 6px 12px; font-size: 12px; margin-top: 0; }

  #statusBox, .msgBox { margin-top: 12px; padding: 10px; border: 1px solid #999999; font-size: 14px; }
  .status-success { background-color: #eafaf0; border-color: #1a7a3c !important; color: #145a2c; }
  .status-error { background-color: #fdeeee; border-color: #b02a2a !important; color: #8f1f1f; }
  .status-info { background-color: #eaf3fb; border-color: #1a5aa8 !important; color: #1a3d6d; }
  .status-warn { background-color: #fdf8e2; border-color: #c96a1a !important; color: #8f4a10; }

  table.stbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  table.stbl th { background-color: #eaf3fb; border: 1px solid #1a5aa8; padding: 6px; text-align: left; }
  table.stbl td { border: 1px solid #999999; padding: 6px; }
  table.stbl tbody tr.row-white { background-color: #ffffff; }
  table.stbl tbody tr.row-yellow { background-color: #fdf8e2; }
  table.stbl tbody tr.absent-row { opacity: .5; }
  table.stbl input[type=number] { width: 55px; padding: 4px; text-align: center; font-weight: bold; color: #1a5aa8; }
  table.stbl input[type=number]:disabled { background-color: #f2f2f2; color: #999999; }

  .att-toggle { display: flex; gap: 4px; }
  .att-btn {
    border: 1px solid #999999; background-color: #ffffff; padding: 5px 10px; font-size: 12px; font-weight: bold;
    cursor: pointer; color: #666666; margin: 0;
  }
  .att-btn.p-active { background-color: #eafaf0; border-color: #1a7a3c; color: #145a2c; }
  .att-btn.a-active { background-color: #fdeeee; border-color: #b02a2a; color: #8f1f1f; }

  footer { text-align: center; font-size: 12px; color: #666666; padding: 15px; }
</style>
</head>

<div class="container">
  <p style="font-size:13px; color:#666666;">For exams already administered at the centre &mdash; enter marks once copies have been checked.</p>

  <fieldset>
    <legend>Centre &amp; Exam</legend>

    <label>Your Name (EV / Official)</label>
    <input type="text" id="reportedBy" placeholder="e.g. Amitabh Choudhury">

    <div class="two-col">
      <div>
        <label>School / Centre</label>
        <select id="schoolSelect"><option value="">-- Select School --</option></select>
      </div>
      <div>
        <label>Exam</label>
        <select id="examSelect"><option value="">-- Select School first --</option></select>
      </div>
    </div>
    <div id="loadMsg" class="msgBox status-info" style="display:none;"></div>
  </fieldset>

  <div id="marksCard" style="display:none;">
    <fieldset>
      <legend id="examHeadTitle">Attendance &amp; Marks</legend>
      <button type="button" onclick="markAllPresent()">Mark all present</button>
      <span id="attCount" style="font-size:13px; color:#666666; margin-left:8px;"></span>
      <div style="overflow-x:auto">
        <table class="stbl" id="marksTable">
          <thead><tr id="marksHeadRow"></tr></thead>
          <tbody id="marksBody"></tbody>
        </table>
      </div>
    </fieldset>
    <div id="saveStatus"></div>
    <button onclick="saveMarks()">Save Marks</button>
    <button type="button" class="btn-orange" id="downloadExcelBtn" style="display:none;" onclick="downloadExcelReport()">Download Excel Report</button>
  </div>

  <footer>Samagra Shiksha &middot; Golaghat &middot; NRSTC Marks Entry</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwyB4C--Q-P0CeIqM_vx0kHLq1M2om7ww063JmSJ996j1RyAmeAIH8zmYSjyoAmyMJA/exec";

let SCHOOL_DATA = [];
let STUDENT_DATA = [];
let EXAM_DATA = [];
let currentExam = null;
let currentStudents = [];
const attendance = {};

function esc(s){ return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getGrade(pct){ if(pct>=80)return'A'; if(pct>=60)return'B'; if(pct>=45)return'C'; if(pct>=33)return'D'; return'F'; }

const schoolSelect = document.getElementById('schoolSelect');
const examSelect = document.getElementById('examSelect');
const loadMsg = document.getElementById('loadMsg');

function showLoadMsg(text, cls){
  loadMsg.style.display = 'block';
  loadMsg.textContent = text;
  loadMsg.className = 'msgBox ' + cls;
}

Promise.all([
  fetch(WEB_APP_URL + '?action=data').then(function(r){ return r.json(); }),
  fetch(WEB_APP_URL + '?action=examList').then(function(r){ return r.json(); })
]).then(function(results){
  SCHOOL_DATA = results[0].schools || [];
  STUDENT_DATA = results[0].students || [];
  EXAM_DATA = results[1].exams || [];

  schoolSelect.innerHTML = '<option value="">-- Select School --</option>';
  SCHOOL_DATA.forEach(function(s, idx){
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = s.name;
    schoolSelect.appendChild(opt);
  });

  const params = new URLSearchParams(window.location.search);
  const preUdise = params.get('udiseCode');
  const preExamId = params.get('examId');
  const preReportedBy = params.get('reportedBy');
  if(preUdise){
    const idx = SCHOOL_DATA.findIndex(function(s){ return s.udiseCode === preUdise; });
    if(idx !== -1) schoolSelect.value = idx;
  }
  if(preReportedBy){
    document.getElementById('reportedBy').value = preReportedBy;
  } else {
    try {
      const savedName = localStorage.getItem('nrstc_marks_entry_name');
      if(savedName) document.getElementById('reportedBy').value = savedName;
    } catch(e){}
  }
  populateExamSelect();
  if(preExamId) examSelect.value = preExamId;
  if(schoolSelect.value !== '' && examSelect.value !== '') loadRoster();
}).catch(function(){
  showLoadMsg('Could not load school/exam data. Check your internet connection.', 'status-error');
});

function populateExamSelect(){
  examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
  EXAM_DATA.forEach(function(x){
    const opt = document.createElement('option');
    opt.value = x.examId;
    opt.textContent = x.examName + ' — ' + x.subjectEN + ' (' + x.classLevel + ', ' + x.examDate + ')';
    examSelect.appendChild(opt);
  });
}

schoolSelect.addEventListener('change', loadRoster);
examSelect.addEventListener('change', loadRoster);

function loadRoster(){
  document.getElementById('marksCard').style.display = 'none';
  document.getElementById('downloadExcelBtn').style.display = 'none';
  document.getElementById('saveStatus').innerHTML = '';
  lastSavedReport = null;
  if(schoolSelect.value === '' || examSelect.value === '') return;

  const school = SCHOOL_DATA[parseInt(schoolSelect.value, 10)];
  currentStudents = STUDENT_DATA.filter(function(st){ return st.udiseCode === school.udiseCode; });

  if(currentStudents.length === 0){
    showLoadMsg('No dropout/never-enrolled students on record for this school.', 'status-warn');
    return;
  }

  showLoadMsg('Loading exam paper...', 'status-info');
  fetch(WEB_APP_URL + '?action=examPaper&examId=' + encodeURIComponent(examSelect.value))
    .then(function(res){ return res.json(); })
    .then(function(exam){
      if(exam.error){ showLoadMsg(exam.error, 'status-error'); return; }
      currentExam = exam;
      loadMsg.style.display = 'none';
      renderMarksTable(school);
    })
    .catch(function(){ showLoadMsg('Could not load the exam paper.', 'status-error'); });
}

function renderMarksTable(school){
  document.getElementById('marksCard').style.display = 'block';
  document.getElementById('examHeadTitle').textContent =
    currentExam.examName + ' — ' + currentExam.subjectEN + ' (' + currentExam.classLevel + ', ' + currentExam.totalMarks + ' marks) — ' + school.name;

  const questions = currentExam.questions || [];
  const headRow = document.getElementById('marksHeadRow');
  let headHtml = '<th>#</th><th>Student Name</th><th>Attendance</th>';
  questions.forEach(function(q, i){
    headHtml += '<th>Q' + (i+1) + '<br><span style="font-weight:normal; font-size:11px;">(' + esc(q.marks) + ')</span></th>';
  });
  headHtml += '<th>Total</th><th>%</th><th>Grade</th>';
  headRow.innerHTML = headHtml;

  const body = document.getElementById('marksBody');
  body.innerHTML = '';
  currentStudents.forEach(function(st, i){
    attendance[i] = attendance[i] !== undefined ? attendance[i] : true;
    const tr = document.createElement('tr');
    tr.id = 'row-' + i;
    tr.className = (i % 2 === 0 ? 'row-white' : 'row-yellow') + (attendance[i] ? '' : ' absent-row');
    let qInputs = '';
    questions.forEach(function(q, qi){
      qInputs += '<td><input type="number" min="0" max="' + esc(q.marks) + '" class="q-input" data-row="' + i + '" data-qi="' + qi + '" data-max="' + esc(q.marks) + '" ' + (attendance[i] ? '' : 'disabled') + ' placeholder="—"></td>';
    });
    tr.innerHTML =
      '<td>' + (i+1) + '</td><td><strong>' + esc(st.name) + '</strong><br><span style="font-size:11px; color:#666666;">(' + esc(st.status) + ')</span></td>' +
      '<td><div class="att-toggle">' +
        '<button type="button" class="att-btn ' + (attendance[i] ? 'p-active' : '') + '" onclick="setAttendance(' + i + ', true)">Present</button>' +
        '<button type="button" class="att-btn ' + (!attendance[i] ? 'a-active' : '') + '" onclick="setAttendance(' + i + ', false)">Absent</button>' +
      '</div></td>' +
      qInputs +
      '<td id="tot-' + i + '"><strong>—</strong></td><td id="pct-' + i + '">—</td><td id="grd-' + i + '">—</td>';
    body.appendChild(tr);
  });

  document.querySelectorAll('.q-input').forEach(function(inp){
    inp.addEventListener('input', function(){ recalcRow(this.dataset.row); });
  });
  updateAttCount();
}

function setAttendance(i, present){
  attendance[i] = present;
  const row = document.getElementById('row-' + i);
  row.className = row.className.replace(' absent-row', '');
  if(!present) row.className += ' absent-row';
  document.querySelectorAll('.q-input[data-row="' + i + '"]').forEach(function(inp){ inp.disabled = !present; if(!present) inp.value = ''; });
  recalcRow(i);
  updateAttCount();
  refreshRowButtons(i, present);
}

function refreshRowButtons(i, present){
  const row = document.getElementById('row-' + i);
  const btns = row.querySelectorAll('.att-btn');
  btns[0].className = 'att-btn ' + (present ? 'p-active' : '');
  btns[1].className = 'att-btn ' + (!present ? 'a-active' : '');
}

function recalcRow(i){
  if(!attendance[i]){
    document.getElementById('tot-' + i).innerHTML = '—';
    document.getElementById('pct-' + i).textContent = '—';
    document.getElementById('grd-' + i).textContent = 'Absent';
    return;
  }
  let total = 0;
  document.querySelectorAll('.q-input[data-row="' + i + '"]').forEach(function(inp){
    total += parseInt(inp.value, 10) || 0;
  });
  const totalMarks = Number(currentExam.totalMarks) || 0;
  const pct = totalMarks ? Math.round(total / totalMarks * 100) : 0;
  const grade = getGrade(pct);
  document.getElementById('tot-' + i).innerHTML = '<strong>' + total + '</strong>';
  document.getElementById('pct-' + i).textContent = pct + '%';
  document.getElementById('grd-' + i).textContent = grade;
}

function markAllPresent(){
  currentStudents.forEach(function(st, i){
    if(!attendance[i]){
      attendance[i] = true;
      const row = document.getElementById('row-' + i);
      row.className = row.className.replace(' absent-row', '');
      document.querySelectorAll('.q-input[data-row="' + i + '"]').forEach(function(inp){ inp.disabled = false; });
      refreshRowButtons(i, true);
      recalcRow(i);
    }
  });
  updateAttCount();
}

function updateAttCount(){
  const presentCount = currentStudents.filter(function(st, i){ return attendance[i]; }).length;
  document.getElementById('attCount').textContent = presentCount + ' of ' + currentStudents.length + ' marked present';
}

let lastSavedReport = null;

function saveMarks(){
  const reportedBy = document.getElementById('reportedBy').value.trim();
  if(!reportedBy){ showSaveStatus('Please enter your name.', 'status-error'); return; }

  const school = SCHOOL_DATA[parseInt(schoolSelect.value, 10)];
  const totalMarks = Number(currentExam.totalMarks) || 0;
  const students = currentStudents.map(function(st, i){
    if(!attendance[i]){
      return { studentName: st.name, attendance: 'Absent', total: 0, breakdown: '' };
    }
    const parts = [];
    let total = 0;
    document.querySelectorAll('.q-input[data-row="' + i + '"]').forEach(function(inp){
      const val = parseInt(inp.value, 10) || 0;
      total += val;
      parts.push('Q' + (parseInt(inp.dataset.qi, 10) + 1) + ':' + val);
    });
    return { studentName: st.name, attendance: 'Present', total: total, breakdown: parts.join(', ') };
  });

  const payload = {
    action: 'submitExamMarks',
    examId: currentExam.examId,
    schoolName: school.name,
    udiseCode: school.udiseCode,
    reportedBy: reportedBy,
    students: students
  };

  showSaveStatus('Saving...', 'status-info');
  fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) })
    .then(function(res){ return res.json(); })
    .then(function(result){
      if(result.status === 'success'){
        try { localStorage.setItem('nrstc_marks_entry_name', reportedBy); } catch(e){}
        lastSavedReport = { school: school, students: students, totalMarks: totalMarks };
        showSaveStatus('Marks saved successfully. Thank you.', 'status-success');
        document.getElementById('downloadExcelBtn').style.display = '';
      } else {
        showSaveStatus('Could not save: ' + (result.message || 'unknown error'), 'status-error');
      }
    })
    .catch(function(){ showSaveStatus('Network error while saving.', 'status-error'); });
}

function showSaveStatus(text, cls){
  document.getElementById('saveStatus').innerHTML = '<div class="msgBox ' + cls + '">' + esc(text) + '</div>';
}

function downloadExcelReport(){
  if(!lastSavedReport) return;
  const totalMarks = lastSavedReport.totalMarks;
  const rows = [['School / Centre', 'Student Name', 'Attendance', 'Marks', 'Total', 'Percentage', 'Grade']];
  lastSavedReport.students.forEach(function(s){
    if(s.attendance === 'Absent'){
      rows.push([lastSavedReport.school.name, s.studentName, 'Absent', '', '', '', '']);
    } else {
      const pct = totalMarks ? Math.round(s.total / totalMarks * 100) : 0;
      rows.push([lastSavedReport.school.name, s.studentName, 'Present', s.total, totalMarks, pct + '%', getGrade(pct)]);
    }
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Results');
  const fileName = (currentExam.examName || 'exam_results').replace(/\s+/g, '_') + '_' + lastSavedReport.school.name.replace(/\s+/g, '_') + '.xlsx';
  XLSX.writeFile(wb, fileName);
}
</script>
